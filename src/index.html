<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F2F4F6">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="가계부">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <!-- 홈 화면에 추가할 때 쓰는 아이콘 · 웹앱 설정 (저장소 맨 위에 있는 파일) -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <!-- 우리집 가계부 · build __BUILD__ · 소스: app/src -->
  <title>우리집 가계부</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <script>
    /* 디자인 기준 : 푸른 기가 없는 회색 + 초록 한 가지 강조색, 그림자 대신 여백과 얇은 선 */
    tailwind.config = { theme: { extend: {
      colors: {
        accent: { DEFAULT: '#0B7A57', hover: '#086247', light: '#E6F4EE', border: '#9CD3BE' },
        slate: { 50: '#F9FAFB', 100: '#F2F4F6', 200: '#E5E8EB', 300: '#D1D6DB', 400: '#A5ADB7', 500: '#8B95A1', 600: '#6B7684', 700: '#4E5968', 800: '#333D4B', 900: '#191F28', 950: '#11161D' }
      },
      fontSize: { xs: ['13px', '1.5'], sm: ['14.5px', '1.55'], base: ['16px', '1.55'], lg: ['18px', '1.45'], xl: ['21px', '1.35'], '2xl': ['26px', '1.25'], '3xl': ['32px', '1.2'] },
      borderRadius: { lg: '10px', xl: '16px', '2xl': '20px' },
      boxShadow: { sm: 'none', DEFAULT: 'none', md: '0 4px 16px rgba(17,22,29,.06)', lg: '0 8px 28px rgba(17,22,29,.10)', xl: '0 12px 36px rgba(17,22,29,.14)', '2xl': '0 20px 48px rgba(17,22,29,.18)' }
    } } };
  </script>
  <style>
/*__CSS__*/
  </style>
</head>
<body class="flex h-screen overflow-hidden text-sm">
  <div id="toast-container" class="fixed z-[10050] flex flex-col gap-2 pointer-events-none"></div>
  <div id="nav-overlay"></div>

  <aside id="sidebar" class="w-60 bg-white flex flex-col border-r border-slate-200 flex-shrink-0">
    <div class="px-5 pt-6 pb-4">
      <button onclick="App.ui.go('dashboard')" class="flex items-center gap-2.5 text-left">
        <span class="brand-mark">가</span>
        <span class="font-bold text-[17px] text-slate-900 tracking-tight">우리집 가계부</span>
      </button>
    </div>
    <nav id="side-nav" class="flex-1 overflow-y-auto px-3 pb-4"></nav>
    <div id="side-foot" class="px-3 py-3 border-t border-slate-200"></div>
  </aside>

  <main class="flex-1 flex flex-col h-full overflow-hidden">
    <header id="app-header" class="h-16 px-8 flex items-center justify-between gap-3 flex-shrink-0">
      <div class="flex items-center gap-2 min-w-0">
        <button id="burger" onclick="App.ui.toggleNav()" class="w-10 h-10 -ml-2 rounded-lg text-slate-700 shrink-0" aria-label="전체 메뉴"><i class="fa-solid fa-bars"></i></button>
        <h2 id="page-title" class="text-xl font-bold text-slate-900 truncate">홈</h2>
      </div>
      <div id="header-tools" class="flex items-center gap-2"></div>
    </header>
    <div id="content" class="flex-1 overflow-y-auto px-8 pb-10 pt-2"></div>
  </main>

  <nav id="mobile-bar" class="fixed bottom-0 inset-x-0 z-40 bg-white border-t border-slate-200 grid grid-cols-5 items-center" style="padding-bottom:env(safe-area-inset-bottom,0px)"></nav>

  <script>
/*__JS__*/
  </script>
</body>
</html>
