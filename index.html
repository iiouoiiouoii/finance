  <script>
/* ===== 00-util.js ===== */
/* 공통 도구 : 포맷 · 날짜(월) 계산 · DOM · 토스트 · 확인창 · 모달
   모든 모듈은 window.App 아래에 자기 이름으로 붙는다 (App.u, App.store, App.calc ...). */
window.App = window.App || {};
(function (App) {
  'use strict';
  var u = App.u = {};

  /* ---------- 값 · 포맷 ---------- */
  u.$ = function (id) { return document.getElementById(id); };
  u.qa = function (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };
  u.esc = function (v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
  };
  u.num = function (v) {
    if (typeof v === 'number') return isFinite(v) ? v : 0;
    var n = parseFloat(String(v == null ? '' : v).replace(/,/g, ''));
    return isFinite(n) ? n : 0;
  };
  /* 입력칸의 "1,234,000" → 1234000 (숫자 이외 문자는 버린다) */
  u.P = function (v) {
    if (typeof v === 'number') return v;
    if (!v) return 0;
    return parseInt(String(v).replace(/[^0-9]/g, ''), 10) || 0;
  };
  u.K = function (v) { return new Intl.NumberFormat('ko-KR').format(Math.round(Number(v) || 0)) + '원'; };
  /* 큰 금액 짧게 : 10.6억원 · 1,234만원 (좁은 칸에서 잘리지 않게) */
  u.KS = function (v) {
    var n = Math.round(Number(v) || 0), a = Math.abs(n), s = n < 0 ? '-' : '';
    if (a >= 1e8) return s + (Math.round(a / 1e7) / 10).toLocaleString('ko-KR') + '억원';
    if (a >= 1e5) return s + Math.round(a / 1e4).toLocaleString('ko-KR') + '만원';
    return s + a.toLocaleString('ko-KR') + '원';

  u.n0 = function (v) { return (Math.round(Number(v) || 0)).toLocaleString('ko-KR'); };
  u.pct = function (x, d) { return ((Number(x) || 0) * 100).toFixed(d == null ? 1 : d) + '%'; };
  u.sum = function (list, f) { return (list || []).reduce(function (s, x) { return s + (Number(f ? f(x) : x) || 0); }, 0); };
  u.uid = function () { return Date.now() * 1000 + Math.floor(Math.random() * 1000); };
  u.byId = function (list, id) { id = Number(id); return (list || []).filter(function (x) { return x.id === id; })[0]; };

  /* ---------- 날짜 · 월 ---------- */
  u.pad = function (n) { return String(n).padStart(2, '0'); };
  u.mIdx = function (m) { var p = String(m || '').split('-'); return (parseInt(p[0], 10) || 1970) * 12 + ((parseInt(p[1], 10) || 1) - 1); };
  u.iMon = function (i) { return Math.floor(i / 12) + '-' + u.pad(i % 12 + 1); };
  u.addM = function (m, n) { return u.iMon(u.mIdx(m) + n); };
  u.today = function () { var d = new Date(); return d.getFullYear() + '-' + u.pad(d.getMonth() + 1) + '-' + u.pad(d.getDate()); };
  u.nowM = function () { return u.today().slice(0, 7); };
  u.dim = function (mo) { var p = String(mo).split('-'); return new Date(+p[0], +p[1], 0).getDate(); };
  u.monthLabel = function (mo) { var p = String(mo).split('-'); return p[0] + '년 ' + parseInt(p[1], 10) + '월'; };
  u.daysBetween = function (a, b) { return Math.round((new Date(b) - new Date(a)) / 86400000); };

  /* ---------- 오류 격리 ---------- */
  u.safe = function (tag, fn) {
    return function () { try { return fn.apply(this, arguments); } catch (e) { console.error('[' + tag + ']', e); } };
  };

  /* data-money 입력칸은 입력하는 대로 천 단위 쉼표를 붙인다 */
  u.money = function (el) { var raw = u.P(el.value); el.value = raw ? raw.toLocaleString('ko-KR') : ''; };
  u.setMoney = function (id, v) { var el = u.$(id); if (el) el.value = v ? Math.round(v).toLocaleString('ko-KR') : ''; };
  u.val = function (id) { var el = u.$(id); return el ? el.value : ''; };

      + (opt.on ? ' onchange="' + opt.on + '"' : '') + (opt.oninput ? ' oninput="' + opt.oninput + '"' : '')

    return '<div class="h-1.5 bg-slate-100 rounded-full overflow-hidden mt-1"><div class="h-full ' + cls + '" style="width:' + Math.max(0, Math.min(100, p || 0)) + '%"></div></div>';
  };

  };
  /* 확인 / 취소 */
  u.confirm = function (title, msg, onOk, okLabel) {
    u.choose(title, msg, [{ label: okLabel || '확인', value: true }, { label: '취소', value: false }]).then(function (ok) { if (ok) onOk(); });
  };

  /* ---------- 모달 ----------
     모달은 각 모듈이 처음 열 때 한 번 만든다 (u.modal(id, html)).
     body 에 'fixed inset-0 ... hidden' 래퍼를 붙이고, 바깥 클릭 · Esc 로 닫힌다. */
  u.modal = function (id, inner, width) {

      m.addEventListener('mousedown', function (e) { if (e.target === m) u.close(id); });

  };

  };

    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  };
})(window.App);

/* ===== 01-store.js ===== */
/* 데이터 저장소 : 불러오기 · 정리(마이그레이션) · 저장 · 이벤트

(function (App) {

  /* ---------- 정리(마이그레이션) : 어떤 버전의 데이터든 지금 구조로 맞춘다 ---------- */
  var arr = function (k) { if (!Array.isArray(App.db[k])) App.db[k] = []; };
  var obj = function (k) { var v = App.db[k]; if (!v || typeof v !== 'object' || Array.isArray(v)) App.db[k] = {}; };
  store.migrate = function () {
    var db = App.db;
    if (!db.settings || typeof db.settings !== 'object') db.settings = emptyData().settings;
    ['transactions', 'fixedExpenses', 'installments', 'realEstates', 'assets', 'liabilities', 'investments', 'cards', 'goals'].forEach(arr);
    ['budgets', 'budgetsByMonth', 'weeklyChecks', 'snapshots', 'ui', 'merchantRules'].forEach(obj);
    if (!Array.isArray(db.categories) || db.categories.length < 9) db.categories = store.defaultCategories();
    if (typeof db.ui.autoReclassify !== 'boolean') db.ui.autoReclassify = false;

    /* 거래 */
    db.transactions.forEach(function (t) {
      if (typeof t.lockCategory !== 'boolean') t.lockCategory = false;
      /* 투자 거래 연동분은 소비/급여가 아닌 자산 간 이동 */
      var m = String(t.memo || '');
      if (t.investmentId && (m.indexOf('[투자매수]') === 0 || m.indexOf('[투자매도]') === 0)) {
        t.type = 'TRANSFER'; t.category = '자산이동'; t.subcategory = m.indexOf('[투자매수]') === 0 ? '투자매수' : '투자매도';
      }
    });

    /* 고정 항목 (v30) : 구분(지출/수입) · 사용자 · 결제수단 · 매달 자동 반영. 예전 항목은 공동 지출 · 계좌이체 · 수동 */
    db.fixedExpenses.forEach(function (f) {
      if (f.type !== 'INCOME') f.type = 'EXPENSE';
      if (['J', 'H', 'W'].indexOf(f.owner) < 0) f.owner = f.type === 'INCOME' ? 'H' : 'J';
      if (!f.payment) f.payment = '계좌이체';
      if (typeof f.auto !== 'boolean') f.auto = false;
      f.day = Math.min(31, Math.max(1, parseInt(f.day, 10) || 1));
      f.amount = Math.max(0, u.num(f.amount));
    });
    if (!db.ui.instAuto || typeof db.ui.instAuto !== 'object') db.ui.instAuto = { on: false };

    /* 할부 (v14) */
    db.installments.forEach(function (i) {
      if (!i.startMonth) {
        var months = Math.max(1, parseInt(i.months, 10) || 1);
        var rem = typeof i.remains === 'number' ? Math.max(0, Math.min(months, i.remains)) : months;
        i.startMonth = u.addM(App.state.month, -Math.max(0, months - rem - 1));
      }
      if (typeof i.apr !== 'number' || isNaN(i.apr)) i.apr = 0;
      if (!Array.isArray(i.prepayments)) i.prepayments = [];
      if (i.prepayMode !== 'REDUCE') i.prepayMode = 'SHORTEN';
      if (!('closedMonth' in i)) i.closedMonth = null;
      if (!i.payment) i.payment = '계좌이체';
      if (!i.category) i.category = '기타지출';
      if (!i.subcategory) i.subcategory = '기타';
      if (typeof i.billingDay !== 'number') i.billingDay = 15;
      i.months = Math.max(1, parseInt(i.months, 10) || 1);
      i.total = Math.max(0, i.total || 0);
      delete i.remains;
    });

    /* 부채 · 부동산 연동 (v17) */
    db.liabilities.forEach(function (l) {
      if (!l.createdFrom) l.createdFrom = l.realEstateId ? 'REALESTATE' : 'MANUAL';
      if (l.amount == null) l.amount = 0;
      if (l.months == null) l.months = 120;
      if (!l.debtType) l.debtType = 'EQUAL_PAYMENT';
    });
    var seen = {};
    db.realEstates.forEach(function (re) {
      var ids = Array.isArray(re.loanIds) ? re.loanIds.slice() : (re.loanId ? [re.loanId] : []);
      re.loanIds = ids.filter(function (id, i, a) {
        if (a.indexOf(id) !== i || seen[id] || !db.liabilities.some(function (l) { return l.id === id; })) return false;
        seen[id] = true; return true;
      });
      re.loanId = re.loanIds[0] || null;
      if (!re.kind) re.kind = '아파트';
      if (re.acquiredPrice === undefined) re.acquiredPrice = null;
      if (re.acquiredDate === undefined) re.acquiredDate = null;
    });
    store.syncLoanRefs();

    /* 투자 (v17) */
    db.investments.forEach(function (inv) {
      if (!inv.assetClass) inv.assetClass = '기타';
      if (!inv.currency) inv.currency = 'KRW';
      if (inv.fxRate == null) inv.fxRate = 1;
      if (!inv.inputMode) inv.inputMode = u.num(inv.qty) > 0 ? 'QTY' : 'AMOUNT';
      ['dividend', 'realized', 'fee', 'monthly'].forEach(function (k) { if (inv[k] == null) inv[k] = 0; });
      if (inv.targetWeight === undefined) inv.targetWeight = null;
      if (inv.broker == null) inv.broker = '';
      if (inv.memo == null) inv.memo = '';
      if (inv.startDate === undefined) inv.startDate = null;
      if (!Array.isArray(inv.trades)) inv.trades = [];
      if (inv.inputMode === 'QTY') {
        if (!u.num(inv.curPrice)) inv.curPrice = u.num(inv.avgPrice);
        if (inv.priceUpdatedAt === undefined) inv.priceUpdatedAt = null;
      } else {
        if (inv.costCur == null) inv.costCur = u.num(inv.cost) || u.num(inv.value);
        if (inv.valueCur == null) inv.valueCur = inv.value == null ? u.num(inv.costCur) : u.num(inv.value);
      }
      if (inv.cumCost == null) inv.cumCost = inv.inputMode === 'QTY' ? u.num(inv.qty) * u.num(inv.avgPrice) : u.num(inv.costCur);
      if (App.invest) { var d = App.invest.detail(inv); inv.cost = d.cost; inv.value = d.value; }
    });
  };

    (db.liabilities || []).forEach(function (l) {

      l.realEstateId = own ? own.id : null;
    });
  };

  };

  function keywordPredict(merchant) {

  /* ---------- 수입 · 이체 분류 (은행 거래내역 · 고정 수입) ---------- */
  cat.predictIncome = function (memo) {

    if (/급여|월급|상여|보너스|salary|payroll/i.test(m)) return { category: '급여', subcategory: '급여/상여' };
    if (/배당/.test(m)) return { category: '금융소득', subcategory: '배당금' };
    if (/이자|결산/.test(m)) return { category: '금융소득', subcategory: '예적금이자' };
    if (/환급|환불|반환/.test(m)) return { category: '부수입', subcategory: '환급금' };

  /* 본인 계좌 간 이체 · 카드대금 결제 · 저축 → 이체 분류 (카드 내역과 이중 집계 방지). 아니면 null */
  cat.predictTransfer = function (memo, dir) {

    var names = [st.husbandName, st.wifeName].map(function (n) { return String(n || '').replace(/\s*\(.*?\)\s*/g, ' ').concat(' ', (String(n || '').match(/\(([^)]+)\)/) || [])[1] || ''); })
      .join(' ').split(/\s+/).filter(function (n) { return n.length >= 2 && n !== '남편' && n !== '아내'; });

  /* ---------- 분류 학습 : 직접 고친 분류를 가맹점별 규칙으로 기억 (db.merchantRules : 정규화 가맹점명 → 분류) ----------
     지점명(…점)·회차·(주) 같은 꼬리는 떼고 비교하므로 '스타벅스 해운대점'에서 배운 규칙이 '스타벅스 센텀점'에도 적용된다. */
  var rules = function () { var r = db().merchantRules; return r && typeof r === 'object' && !Array.isArray(r) ? r : (db().merchantRules = {}); };
  cat.merchantKey = function (memo) {
    var s = String(memo || '').replace(/^\s*\[[^\]]*\]\s*/, '').replace(/[(\[]\s*\d+\s*회?\s*\/\s*\d+\s*회?\s*[)\]]/g, ' ')

    if (!best || !cat.subExists(R[best].category, R[best].subcategory)) return null;

  cat.learn = function (memo, category, subcategory) {

  /* ---------- 재분류 계획 ---------- */
  function isProtected(t) { var m = String(t.memo || ''); return !!t.installmentId || m.indexOf('[고정비]') === 0 || m.indexOf('[할부') === 0; }

/* 시작 : 데이터 불러오기 → 화면 뼈대 → 동기화·알림 → 첫 화면 */
(function (App) {
  'use strict';

      if (App.calc.autoCloseInstallments()) App.store.save({ quiet: true });
